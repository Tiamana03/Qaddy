# Qaddy analyzer configuration.
#
# Base: very_good_analysis — a maintained superset of flutter_lints chosen
# for long-term maintainability over the bare default, per the founders'
# explicit engineering standards. See the Claude Build Package, "Engineering
# Standards."
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # very_good_analysis requires doc comments on every public member. Right
    # for a published package; too heavy for an early-stage app where most
    # public surface is still placeholder scaffolding (see M0's .gitkeep.md
    # notes throughout lib/features/*). Revisit turning this back on once the
    # core/ and repository interfaces stabilise.
    public_member_api_docs: false
