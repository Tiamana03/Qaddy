name: qaddy
description: "Qaddy — the golfer's ecosystem. One app for rounds, golf bag, trips, Golf IQ, achievements and memories."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State management + dependency injection (see core/ for the repository/service
  # interfaces that keep every provider here vendor-agnostic).
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Backend
  supabase_flutter: ^2.8.0

  # Crash reporting (live from M0 — see core/services/crash_reporting_service.dart)
  sentry_flutter: ^8.13.0

  # Product analytics (Noop binding until a launch-geography/data-residency
  # decision is made — see core/services/analytics_service.dart)
  posthog_flutter: ^4.10.0

  # Routing
  go_router: ^14.6.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Superset of flutter_lints, chosen for long-term maintainability
  # per the founders' explicit engineering standards (see analysis_options.yaml).
  very_good_analysis: ^7.0.0

  riverpod_generator: ^2.6.3
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
